name: Build PKG Converter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q PKGConverterAndroid_REAL.zip -d project

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Extract PS4 backend
        run: |
          rm -rf ps4backend
          mkdir -p ps4backend

          unzip -q PS4pkg_to_ffpfsc-0.2.9.zip -d ps4backend

          ROOT=$(find ps4backend -name ps4ffpsc.toml -print -quit | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Could not find ps4ffpsc.toml"
            exit 1
          fi

          echo "PS4 backend root:"
          echo "$ROOT"

          mkdir -p "$PROJECT_DIR/app/src/main/python/backend"

          rm -rf "$PROJECT_DIR/app/src/main/python/ps4ffpsc"

          cp -r "$ROOT/ps4ffpsc" \
            "$PROJECT_DIR/app/src/main/python/"

          cp "$ROOT/ps4ffpsc.toml" \
            "$PROJECT_DIR/app/src/main/python/backend/"

          echo "PS4 Python backend copied."

      - name: Download MkPFS source
        run: |
          rm -rf mkpfs-source

          git clone --depth 1 --branch 1.0.0 \
            https://github.com/PSBrew/MkPFS.git \
            mkpfs-source

          if [ ! -d "mkpfs-source/mkpfs" ]; then
            echo "ERROR: MkPFS source directory was not found."
            exit 1
          fi

          echo "MkPFS source downloaded."

      - name: Prepare Android MkPFS package
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf third_party/mkpfs
          mkdir -p third_party/mkpfs

          cp -r "$GITHUB_WORKSPACE/mkpfs-source/mkpfs" \
            third_party/mkpfs/

          cat > third_party/mkpfs/pyproject.toml <<'EOF'
          [build-system]
          requires = ["hatchling<1.32"]
          build-backend = "hatchling.build"

          [project]
          name = "mkpfs"
          version = "1.0.0"
          requires-python = ">=3.9"

          dependencies = [
            "cryptography>=47.0.0",
            "zlib-ng>=0.5.1",
            "isal>=1.0.0; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'aarch64' or platform_machine == 'arm64'"
          ]

          [project.scripts]
          mkpfs = "mkpfs.cli:main"

          [tool.hatch.build.targets.wheel]
          packages = ["mkpfs"]
          EOF

          echo "Prepared Android MkPFS package:"
          find third_party/mkpfs -maxdepth 2 -type f | sort

      - name: Verify MkPFS package
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f third_party/mkpfs/mkpfs/__init__.py
          test -f third_party/mkpfs/mkpfs/cli.py
          test -f third_party/mkpfs/pyproject.toml

          echo "MkPFS package structure OK."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Python
        run: |
          python3.13 --version

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew 2>/dev/null || true

          echo "Python:"
          python3.13 --version

          echo "Gradle:"
          gradle --version

          echo "Starting Android build..."

          gradle assembleDebug --stacktrace

      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "APK files produced:"

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PKG-Converter-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
