name: Build PKG Converter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q PKGConverterAndroid_REAL.zip -d project

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Extract PS4 backend
        run: |
          rm -rf ps4backend
          mkdir -p ps4backend

          unzip -q PS4pkg_to_ffpfsc-0.2.9.zip -d ps4backend

          ROOT=$(find ps4backend -name ps4ffpsc.toml -print -quit | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Could not find ps4ffpsc.toml"
            exit 1
          fi

          echo "PS4 backend root: $ROOT"

          mkdir -p "$PROJECT_DIR/app/src/main/python/backend"

          rm -rf "$PROJECT_DIR/app/src/main/python/ps4ffpsc"

          cp -r "$ROOT/ps4ffpsc" \
            "$PROJECT_DIR/app/src/main/python/"

          cp "$ROOT/ps4ffpsc.toml" \
            "$PROJECT_DIR/app/src/main/python/backend/"

          echo "PS4 Python backend copied."

      - name: Use MkPFS Python package
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i "s#install './third_party/mkpfs'#install 'mkpfs'#" app/build.gradle

          echo "Updated Chaquopy dependencies:"
          cat app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Python
        run: |
          python3.13 --version

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew 2>/dev/null || true

          echo "Python:"
          python3.13 --version

          echo "Gradle:"
          gradle --version

          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PKG-Converter-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
