name: Build PKG Converter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # SOURCE
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # ANDROID PROJECT
      # ------------------------------------------------------------

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q PKGConverterAndroid_REAL.zip -d project

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"


      # ------------------------------------------------------------
      # PS4 PYTHON BACKEND
      # ------------------------------------------------------------

      - name: Extract PS4 backend
        run: |
          rm -rf ps4backend
          mkdir -p ps4backend

          unzip -q PS4pkg_to_ffpfsc-0.2.9.zip -d ps4backend

          ROOT=$(find ps4backend -name ps4ffpsc.toml -print -quit | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: ps4ffpsc.toml was not found."
            exit 1
          fi

          echo "PS4 backend root:"
          echo "$ROOT"

          mkdir -p "$PROJECT_DIR/app/src/main/python/backend"

          rm -rf "$PROJECT_DIR/app/src/main/python/ps4ffpsc"

          cp -r "$ROOT/ps4ffpsc" \
            "$PROJECT_DIR/app/src/main/python/"

          cp "$ROOT/ps4ffpsc.toml" \
            "$PROJECT_DIR/app/src/main/python/backend/"

          echo "PS4 Python backend copied."


      # ------------------------------------------------------------
      # MKPFS
      # ------------------------------------------------------------

      - name: Download MkPFS
        run: |
          rm -rf mkpfs-source

          git clone --depth 1 \
            https://github.com/PSBrew/MkPFS.git \
            mkpfs-source

          if [ ! -d "mkpfs-source/mkpfs" ]; then
            echo "ERROR: MkPFS Python package was not found."
            exit 1
          fi

          echo "MkPFS source downloaded."


      - name: Bundle MkPFS directly into Python
        run: |
          rm -rf "$PROJECT_DIR/app/src/main/python/mkpfs"

          cp -r \
            mkpfs-source/mkpfs \
            "$PROJECT_DIR/app/src/main/python/mkpfs"

          echo "MkPFS bundled into Android Python source."

          find "$PROJECT_DIR/app/src/main/python/mkpfs" \
            -maxdepth 2 \
            -type f \
            | sort


      # ------------------------------------------------------------
      # FIX ANDROID GRADLE DEPENDENCIES
      # ------------------------------------------------------------

      - name: Remove local MkPFS pip dependency
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")

          text = p.read_text()

          old = "            install './third_party/mkpfs'\n"

          if old in text:
              text = text.replace(old, "")

          p.write_text(text)

          print("Updated app/build.gradle:")
          print(p.read_text())
          PY


      # ------------------------------------------------------------
      # JAVA
      # ------------------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python
        run: |
          python3.13 --version


      # ------------------------------------------------------------
      # ANDROID SDK
      # ------------------------------------------------------------

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ------------------------------------------------------------
      # VERIFY PYTHON SOURCE
      # ------------------------------------------------------------

      - name: Verify bundled Python packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f app/src/main/python/mkpfs/__init__.py
          test -f app/src/main/python/ps4ffpsc/__init__.py

          echo "Python packages found."

          echo "MkPFS:"
          ls app/src/main/python/mkpfs

          echo "PS4 backend:"
          ls app/src/main/python/ps4ffpsc


      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew 2>/dev/null || true

          echo "Python:"
          python3.13 --version

          echo "Gradle:"
          gradle --version

          echo "Starting Android build..."

          gradle assembleDebug --stacktrace


      # ------------------------------------------------------------
      # VERIFY APK
      # ------------------------------------------------------------

      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "APK files:"

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "APK successfully produced:"
          echo "$APK"


      # ------------------------------------------------------------
      # ARTIFACT
      # ------------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PKG-Converter-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
