name: Build PKG Converter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/example/pkgconverter
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PKGConverter"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.pkgconverter'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.pkgconverter'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '0.1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="PKG Converter"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#2196F3</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/example/pkgconverter/MainActivity.java <<'EOF'
          package com.example.pkgconverter;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.OpenableColumns;
          import android.view.ViewGroup;
          import android.widget.*;

          import java.io.BufferedInputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {

              private TextView status;
              private TextView details;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(32, 32, 32, 32);

                  TextView title = new TextView(this);
                  title.setText("PKG Converter");
                  title.setTextSize(28);
                  root.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("Automatic PS4 / PS5 package detection");
                  subtitle.setTextSize(16);
                  subtitle.setPadding(0, 12, 0, 24);
                  root.addView(subtitle);

                  Button select = new Button(this);
                  select.setText("SELECT PKG");
                  select.setOnClickListener(v -> selectPkg());
                  root.addView(select,
                      new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  status = new TextView(this);
                  status.setText("No package selected.");
                  status.setTextSize(17);
                  status.setPadding(0, 28, 0, 12);
                  root.addView(status);

                  details = new TextView(this);
                  details.setText(
                      "Select a PS4 or PS5 PKG to inspect it.\n\n" +
                      "The converter backend will be integrated after the " +
                      "Android build is confirmed."
                  );
                  details.setTextSize(15);
                  root.addView(details);

                  TextView outputTitle = new TextView(this);
                  outputTitle.setText("\nOutput format");
                  outputTitle.setTextSize(18);
                  root.addView(outputTitle);

                  Spinner spinner = new Spinner(this);
                  String[] formats = {
                      "Folder / dump",
                      "exFAT",
                      "FFPFSC",
                      "FFPKG"
                  };

                  ArrayAdapter<String> adapter =
                      new ArrayAdapter<>(
                          this,
                          android.R.layout.simple_spinner_dropdown_item,
                          formats
                      );

                  spinner.setAdapter(adapter);
                  root.addView(spinner);

                  TextView note = new TextView(this);
                  note.setText(
                      "\nCurrent build: package inspection prototype.\n\n" +
                      "The actual PS4/PS5 conversion engines will be added " +
                      "after the APK build is working."
                  );
                  note.setTextSize(14);
                  root.addView(note);

                  setContentView(root);
              }

              private void selectPkg() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.setType("*/*");
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(intent, 100);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data);

                  if (requestCode != 100 ||
                      resultCode != RESULT_OK ||
                      data == null ||
                      data.getData() == null) {
                      return;
                  }

                  inspect(data.getData());
              }

              private void inspect(Uri uri) {
                  try {
                      String filename = getFilename(uri);

                      status.setText(
                          "Selected:\n" + filename
                      );

                      InputStream raw =
                          getContentResolver().openInputStream(uri);

                      BufferedInputStream input =
                          new BufferedInputStream(raw);

                      byte[] buffer = new byte[1024 * 1024];

                      int count = input.read(buffer);

                      input.close();

                      if (count <= 0) {
                          details.setText(
                              "Could not read the package."
                          );
                          return;
                      }

                      String text =
                          new String(
                              buffer,
                              0,
                              count,
                              StandardCharsets.ISO_8859_1
                          );

                      boolean ps5 =
                          text.contains("PPSA") ||
                          text.contains("PPS");

                      boolean ps4 =
                          text.contains("CUSA") ||
                          text.contains("PCAS");

                      String platform;

                      if (ps5 && !ps4) {
                          platform = "LIKELY PS5";
                      } else if (ps4 && !ps5) {
                          platform = "LIKELY PS4";
                      } else if (ps4 && ps5) {
                          platform = "PS4/PS5 indicators found";
                      } else {
                          platform =
                              "Platform not identified from sampled data";
                      }

                      details.setText(
                          "Package inspection\n\n" +
                          "Platform: " + platform + "\n\n" +
                          "The file can now be passed to the appropriate " +
                          "conversion backend once integrated."
                      );

                  } catch (Exception e) {
                      details.setText(
                          "Inspection error:\n" +
                          e.getMessage()
                      );
                  }
              }

              private String getFilename(Uri uri) {
                  android.database.Cursor cursor =
                      getContentResolver().query(
                          uri,
                          null,
                          null,
                          null,
                          null
                      );

                  if (cursor != null) {
                      try {
                          int index =
                              cursor.getColumnIndex(
                                  OpenableColumns.DISPLAY_NAME
                              );

                          if (cursor.moveToFirst() && index >= 0) {
                              return cursor.getString(index);
                          }

                      } finally {
                          cursor.close();
                      }
                  }

                  return uri.toString();
              }
          }
          EOF

          gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PKGConverter-debug
          path: app/build/outputs/apk/debug/app-debug.apk
